# Kigali Keys backend — STAGING.
# One machine, one SQLite database on a persistent volume. Do not scale past
# one instance: the rate limiter and idempotency store for replay-dedupe are
# per-process (SQLite is also single-writer).

app = "kigali-keys-staging"
primary_region = "jnb"  # Johannesburg — closest Fly region to Kigali

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HTTP_HOST = "0.0.0.0"
  # Staging pointed back at r7 2026-09-03 (deliberate, do NOT re-bump): this is
  # the pre-production gate for commit 3fe1ff0, which extends
  # normalize-property-media! to ALSO normalise gallery_images rows in place
  # (rename <stem>.<ext> -> <stem>.jpg, re-encode through kigali.images to match
  # a fresh seed, idempotent). The retained r7 volume is a real half-migrated
  # old-scheme DB: init + sent-emails + 20260903000001 applied, staticMapUrl
  # already rewritten last round, but the 2 Kia Sorento gallery rows are still
  # sorento1.jpeg / sorento2.jpeg with un-re-encoded bytes -> those images 404
  # against the CDN bundle (which ships sorento1.jpg / sorento2.jpg). That is
  # exactly what a prod in-place upgrade of the existing /data/kigali-keys.db
  # would hit, so r7 is the correct test bed. The r8 bump (a fresh reseed) does
  # NOT exercise the fix and has been reverted. Expected boot log:
  # normalize-property-media! {:map-url-rewritten false, :re-encoded 2,
  # :renamed 2, :untouched 23}; a second deploy is a no-op ({:re-encoded 0,
  # :renamed 0, :untouched 25}). Carries forward the r7 reset below.
  #
  # Staging data reset 2026-09-01 (r7): bumped to a fresh db/media path so the
  # idempotent seeder repopulates property/pricing/legal/gallery from a clean
  # slate, and the new §26b migration
  # (20260901000001-sent-emails-status-reference: adds status +
  # booking_reference columns and two indexes to sent_emails) applies cleanly
  # as part of the initial migration set on the fresh DB. Carries forward the
  # r6 reset below.
  #
  # Staging data reset 2026-08-30 (r6): bumped to a fresh db/media path so the
  # idempotent seeder repopulates property/pricing/legal/gallery from a clean
  # slate. r6 extends the r5 QA-blocker fix for PUT /admin/settings to the
  # guestResponseTimeText field — it is now optional/nullable too (matching
  # publicPhone), and a blank/whitespace value normalises to nil so the owner
  # can clear the "response time" line and GET /property's contact projection
  # returns null rather than "". Carries forward the r5 pass (publicPhone
  # optional/nullable/clearable, admin-JS placeholder cleanup), the r4 pass
  # (public `contact` block on GET /property, hostDisplayName "Peter",
  # publicEmail info@kigalikeys.rw, publicPhone nil -> contact.phone null) and
  # the round-3 pass (British-English copy, climate/kitchen fixes, cleaningFee
  # 35->30, houseRules v3 / privacy v3 / websiteTerms v2).
  # Prior r1..r6 paths are left on the volume, unused. The DB holds no real data.
  DATABASE_URL = "jdbc:sqlite:/data/kigali-keys-r7.db"
  MEDIA_DIR = "/data/media-r7"
  SEED_PHOTOS_DIR = "/app/assets/property-photos"
  SESSION_COOKIE_SECURE = "true"
  DB_POOL_SIZE = "1"
  RATE_LIMIT_MAX = "10"

# Persistent disk. MEDIA_DIR and the SQLite file both live here so gallery
# originals/thumbnails and all data survive restarts and redeploys.
[[mounts]]
  source = "kigali_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep one instance warm so the CDN proxy never
                             # hits a cold start; still capped at one machine
  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
