<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>That page isn't here — Kigali Keys</title>
  <meta name="robots" content="noindex">
  <!-- Warm the API origin before the first fetch. Committed value is the staging
       backend (matches _redirects); scripts/deploy-frontend-prod.sh rewrites it
       to the production origin, exactly as it does for the /api/* proxy line. -->
  <link rel="preconnect" href="https://kigali-keys-staging.fly.dev" crossorigin>
  <link rel="dns-prefetch" href="https://kigali-keys-staging.fly.dev">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <div class="container section">
      <h1>That page isn't here</h1>
      <p>The link may be old, or the address slightly off. Here is the way back.</p>
      <p class="stack">
        <a class="btn btn--primary" href="/">Go to the home page</a>
      </p>
      <ul>
        <li><a href="/gallery">Photo gallery</a></li>
        <li><a href="/the-car">The car</a></li>
        <li><a href="/contact">Contact the host</a></li>
      </ul>
      <form id="lookup-form" class="form" style="max-width:420px;margin-top:2rem">
        <div class="field">
          <label for="ref">Look up a booking</label>
          <input type="text" id="ref" name="ref" placeholder="KK-XXXXXX" autocomplete="off">
          <span class="hint">Enter your booking reference to check its status.</span>
        </div>
        <button class="btn btn--ghost" type="submit">Find my booking</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/assets/js/pages/not-found.js"></script>
</body>
</html>
